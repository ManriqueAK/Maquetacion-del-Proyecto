<!DOCTYPE html>
<html lang="es">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="assets/css/styles.css">
        <title>Iniciar seisón</title>
    </head>


    <body style="background-image: url(assets/images/portada.jpg); background-attachment: fixed; background-position: center; background-size: cover; background-repeat: no-repeat;">

        <header class="encabezado">

            <a href="index.html" class="logo"><img src="assets/images/logo.jpg" width="60"></a>

            <nav class="menu">

                <ul>

                    <li><a href="index.html">INICIO</a></li>
                    <li><a href="index.html">SERVICIOS</a></li>
                    <li><a href="index.html">UBICACIÓN</a></li>
                    <li></li>

                </ul>
                
            </nav>

        </header>

        <div class="login-container">

            <div class="imagen-login">

                <img src="assets/images/login.png.png" width="300">

            </div>

            <div class="ingreso">

                <h1>Inicia sesión</h1>

                <form>

                    <input type="email" id="correo" placeholder="Correo electrónico" required>
                    <input type="password" id="password" placeholder="Contraseña" required>
                    <a href="#" class="recuperar">¿Has olvidado tu contraseña?</a>

                    <div class="captcha">

                        <input type="checkbox" id="robot">
                        <label for="robot">No soy un robot</label>
            
                    </div>

                    <button type="button">
                        <a href="panel.html">INGRESAR</a>
                    </button>
                    
                </form>
            
            </div>

        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    </body>

</html>
